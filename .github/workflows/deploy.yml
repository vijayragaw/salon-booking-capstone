name: Deploy demo to AWS
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: salon-aws-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check && npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through Systems Manager
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          git archive -o "$RUNNER_TEMP/salon.tar.gz" HEAD Dockerfile .dockerignore backend public
          artifact="s3://$ARTIFACT_BUCKET/salon/$GITHUB_SHA.tar.gz"
          aws s3 cp "$RUNNER_TEMP/salon.tar.gz" "$artifact"
          remote=$(jq -n --arg artifact "$artifact" --arg version "$GITHUB_SHA" '{
            commands: [
              "set -eu",
              "test -s /etc/salon-booking.env",
              "work=$(mktemp -d)",
              "trap \"rm -rf -- $work\" EXIT",
              ("aws s3 cp " + $artifact + " \"$work/source.tar.gz\""),
              "tar -xzf \"$work/source.tar.gz\" -C \"$work\"",
              ("docker build -t salon-booking:" + $version + " \"$work\""),
              "docker rm -f salon-booking 2>/dev/null || true",
              ("docker run -d --name salon-booking --restart unless-stopped --env-file /etc/salon-booking.env -p 127.0.0.1:3000:3000 salon-booking:" + $version),
              "curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/api/services"
            ]
          }')
          command=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters "$remote" --query Command.CommandId --output text)
          status=0
          aws ssm wait command-executed --command-id "$command" --instance-id "$INSTANCE_ID" || status=$?
          aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          exit "$status"
